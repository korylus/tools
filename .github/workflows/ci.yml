name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.26.3"
  # Pin golangci-lint to the version Groobb uses, so local and CI lint with the
  # same rules.
  # [Ja] golangci-lint を Groobb と同じバージョンに固定し、ローカルと CI が同じ
  # ルールで lint するようにする。
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Check binary exists
        run: test -f bin/koryluslint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: go mod download

      - name: Vet
        run: make vet

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Build golangci-lint from source with the CI Go toolchain instead of the
      # prebuilt binary. golangci-lint refuses to analyze a module whose go
      # directive targets a newer Go than the one it was built with, and the
      # published binaries lag behind go 1.26.
      #
      # [Ja] golangci-lint を配布バイナリではなく CI の Go ツールチェーンでソースから
      # ビルドする。golangci-lint は自身のビルドに使われた Go より新しい go ディレク
      # ティブを持つ module の解析を拒否し、配布バイナリは go 1.26 への追従が遅れるため。
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: make lint

  fmt-check:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: make fmt-check
