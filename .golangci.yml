# golangci-lint v2の設定ファイル (初期は最小構成)
# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet # Go標準の静的解析
    - staticcheck # 高度な静的解析
    - errcheck # 未チェックのエラーを検出
    - ineffassign # 無効な代入を検出
    - unused # 未使用コードを検出
    - gosec # セキュリティチェック
  settings:
    errcheck:
      # fmtのprint系によるstdout/stderrへの書き込みは、失敗しても回復できない
      # (broken pipeなど) ため、エラーチェックを必須にしない。
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt # Go標準フォーマット
    - goimports # import文の整理
  settings:
    goimports:
      # 本モジュールのimportをサードパーティと分けてグループ化する。
      local-prefixes:
        - github.com/korylus/tools
